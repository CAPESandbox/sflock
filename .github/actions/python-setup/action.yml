name: 'Python setup steps that can be reused'
description: 'Install system dependencies, uv, and project requirements'
inputs:
  python-version:
    required: true
    description: The python version

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends p7zip-full libxml2-dev libxslt-dev python3-dev libgeoip-dev ssdeep libfuzzy-dev zpaq rar unace-nonfree cabextract lzip libjpeg8-dev zlib1g-dev gnupg

    - name: Install uv and Python ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install requirements
      shell: bash
      run: uv sync --locked --extra shellcode --extra linux --group dev
